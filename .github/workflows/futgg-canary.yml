# Checks that the extension can still read fut.gg.
#
# src/futgg/page.ts is the one file that knows how fut.gg builds a page: a handful of CSS
# selectors and URL patterns. fut.gg owes us nothing and redesigns when it likes, and when
# it does, the pill quietly stops appearing — nothing throws, no test fails, and the first
# to notice is a user. So once a day this renders real fut.gg pages and runs those real
# selectors over them.
#
# It takes two failures to open an issue: rendering someone else's site over the public
# internet fails for reasons that have nothing to do with their markup, and a canary that
# cries on an unlucky minute is one nobody reads. The second attempt renders fresh pages a
# minute later, and the issue says which of the two things actually broke — the render, or
# the selectors — because they need different fixes.
#
# A selector failure means fut.gg changed, not that the build is broken. The issue it opens
# carries the failing assertions and the rendered pages, which is what fixing it needs:
#
#   gh run download <run id> -n futgg-snapshots -D futgg-snapshots
#   pnpm test futgg/live
#
# ...then fix src/futgg/page.ts against the snapshot until it passes.
name: fut.gg canary

on:
  schedule:
    - cron: "41 6 * * *" # daily, before the Web Store watch
  workflow_dispatch:
  # So a change to the reading code is checked against the live site before it ships,
  # rather than a day later.
  pull_request:
    paths:
      - "src/futgg/**"
      - "src/lib/price.ts"
      - "scripts/futgg-snapshot.mjs"
      - ".github/workflows/futgg-canary.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: futgg-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner image ships Chrome, so there is no browser to install and no
      # Playwright-shaped dependency to keep current.
      - name: Read fut.gg with the extension's own selectors
        id: canary
        shell: bash
        run: |
          set -o pipefail
          # Renders fut.gg afresh and runs the real selectors over it, leaving in $stage
          # what it got as far as: a render that never arrived, or selectors that no
          # longer read the page it rendered.
          attempt() {
            : > canary.log
            stage=render
            node scripts/futgg-snapshot.mjs 2>&1 | tee -a canary.log || return 1
            stage=selectors
            pnpm test futgg/live 2>&1 | tee -a canary.log || return 1
            stage=ok
          }
          stage=ok
          if ! attempt; then
            echo "::warning::the canary failed at the $stage stage; rendering again in 60s before saying so"
            sleep 60
            attempt || true
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          [ "$stage" = ok ]

      # Kept whether or not it passed: a passing run's snapshot is the last known-good
      # shape of the site, which is useful the day one stops passing. Gated on the files
      # rather than on the step, because a render that failed on its last attempt can
      # still have left the pages an earlier one managed.
      - name: Keep the snapshots
        id: snapshots
        if: ${{ always() && hashFiles('futgg-snapshots/index.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: futgg-snapshots
          path: |
            futgg-snapshots/*.html
            futgg-snapshots/index.json
          retention-days: 14

      # On a pull request the failure speaks for itself in the checks; an issue is for the
      # scheduled run, where otherwise nobody is looking.
      - name: Open an issue
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGE: ${{ steps.canary.outputs.stage }}
          SNAPSHOTS: ${{ steps.snapshots.outcome }}
        run: |
          if [ "$STAGE" = selectors ]; then
            title="fut.gg changed: the extension can no longer read it"
          else
            title="fut.gg canary could not render the site"
          fi
          {
            if [ "$STAGE" = selectors ]; then
              echo "fut.gg renders, but the selectors in \`src/futgg/page.ts\` no longer read it"
              echo "the way they used to. Until this is fixed the pill will be missing, or wrong,"
              echo "on the pages below. Twice in a row, a minute apart, so this is the site and"
              echo "not a bad moment."
            else
              echo "Chrome could not render fut.gg, twice, a minute apart — so **whether the"
              echo "selectors still work is unknown and \`src/futgg/page.ts\` is not implicated.**"
              echo "Either fut.gg was unreachable or unhappy with us, or the render in"
              echo "\`scripts/futgg-snapshot.mjs\` needs looking at. Check by hand before changing"
              echo "any selector:"
              echo
              echo '```sh'
              echo "node scripts/futgg-snapshot.mjs && pnpm test futgg/live"
              echo '```'
            fi
            echo
            echo "<details><summary>What failed</summary>"
            echo
            echo '```'
            tail -c 8000 canary.log 2>/dev/null || echo "the canary produced no output"
            echo '```'
            echo
            echo "</details>"
            echo
            if [ "$SNAPSHOTS" = success ]; then
              echo "To work on it, with the exact pages this run saw:"
              echo
              echo '```sh'
              echo "gh run download ${{ github.run_id }} -n futgg-snapshots -D futgg-snapshots"
              echo "pnpm test futgg/live"
              echo '```'
              echo
            fi
            echo "[The run]($RUN)"
          } > body.md
          open=$(gh issue list --label futgg --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh label create futgg --description "Reading fut.gg" --color 1d76db --force
            gh issue create --title "$title" --label futgg --body-file body.md
          fi
